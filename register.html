<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>新規会員登録｜もりの</title>
    <meta name="description" content="テキストテキストテキストテキストテキストテキストテキストテキスト">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/logo.png">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <!-- プラグイン「slick」のcssを読み込む -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Castoro+Titling&family=Noto+Serif+JP:wght@200..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="register-page">

        <div class="register-box">

            <img src="img/logo.png" alt="もりの" class="register-logo">

            <h1>新規会員登録</h1>

            <form class="register-form">

                <div class="form-group">
                    <label>ユーザー名<span class="red">※</span></label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>姓<span class="red">※</span></label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>名<span class="red">※</span></label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>電話番号</label>
                    <input type="tel">
                </div>

                <div class="form-group">
                    <label>メールアドレス<span class="red">※</span></label>
                    <input type="email">
                </div>


                <div class="form-group">
                    <label>パスワード<span class="red">※</span></label>
                    <input type="password">
                </div>

                <div class="form-group">
                    <label>パスワード（確認）<span class="red">※</span></label>
                    <input type="password">
                </div>

                <button type="submit" class="register-btn">
                    登録
                </button>

            </form>

            <p class="red2">※<span class="add">必須項目</span></p>

            <a href="login.html" class="login-link">
                ログインはこちら
            </a>

        </div>

    </main>




    <!-- <script src="availability.js"></script> -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- slickを使うのに必要なjsファイル -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
