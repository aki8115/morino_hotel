<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ログイン｜もりの</title>
    <meta name="description" content="テキストテキストテキストテキストテキストテキストテキストテキスト">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/logo.png">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <!-- プラグイン「slick」のcssを読み込む -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Castoro+Titling&family=Noto+Serif+JP:wght@200..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <a href="index.html#top" class="logo-center">

                <img src="img/logo.png" alt="もりの" class="login-logo">
            </a>

            <h1>LOGIN</h1>

            <form class="login-form">

                <div class="form-group">
                    <label>ユーザー名またはメールアドレス</label>
                    <input type="email" placeholder="example@example.com">
                </div>

                <div class="form-group">
                    <label>パスワード</label>
                    <input type="password" placeholder="********">
                </div>

                <button type="submit" class="login-btn">
                    ログイン
                </button>

            </form>

            <div class="login-links">

                <a href="register.html">
                    新規会員登録はこちら
                </a>

                <a href="#">
                    パスワードを忘れた方はこちら
                </a>

            </div>

        </div>

    </main>

    <!-- <script src="availability.js"></script> -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- slickを使うのに必要なjsファイル -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
